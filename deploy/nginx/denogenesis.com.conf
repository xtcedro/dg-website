# Nginx site config for DenoGenesis on denogenesis.com (official domain).
#
# Nginx does the three things it is genuinely better at than an application
# process — TLS termination, compression, and absorbing connection abuse — and
# nothing else. It adds no headers of its own: the Content-Security-Policy and
# the rest are the application's (src/http.ts), and are not duplicated here
# where the two copies would inevitably drift apart.
#
# Assumptions:
# - The Deno app runs locally on 127.0.0.1:8004.
# - A Let's Encrypt certificate already exists for denogenesis.com and
#   www.denogenesis.com. deploy/deploy.sh issues it (webroot, no downtime)
#   before it installs this file; the manual runbook is in README.md.
#
# The box-wide pieces this depends on live beside it in the repo and are
# installed once, not per site: deploy/nginx/snippets/deny-probes.conf
# (included below) and deploy/nginx/00-default-drop (the catch-all that closes
# the connection on anything addressed to no server_name at all).
#
# 00-default-drop is a hard dependency, not a nicety. It is parsed first — the
# `00-` prefix is why it is named that — and it is where `listen 443 ssl http2`
# is declared. Protocol options belong to the address:port rather than to a
# server block, so this file's `listen 443;` lines are deliberately bare and
# inherit them. Install this vhost without 00-default-drop and :443 would serve
# plaintext. deploy/deploy.sh always installs both, in that order.
#
# Install example (deploy/deploy.sh does all of this):
#   sudo install -d -m 0755 /var/www/certbot
#   sudo cp deploy/nginx/snippets/deny-probes.conf /etc/nginx/snippets/deny-probes.conf
#   sudo cp deploy/nginx/00-default-drop /etc/nginx/sites-available/00-default-drop
#   sudo ln -sf /etc/nginx/sites-available/00-default-drop /etc/nginx/sites-enabled/00-default-drop
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo cp deploy/nginx/denogenesis.com.conf /etc/nginx/sites-available/denogenesis.com
#   sudo ln -sf /etc/nginx/sites-available/denogenesis.com /etc/nginx/sites-enabled/denogenesis.com
#   sudo nginx -t
#   sudo systemctl reload nginx

upstream denogenesis_deno {
    server 127.0.0.1:8004;
    keepalive 16;
}

# Per-IP rate limit zones for basic DoS / abuse mitigation. Defined in the http
# context (sites-enabled is included inside http {}). The waitlist write path
# gets a much tighter budget than static reads.
limit_req_zone $binary_remote_addr zone=denogenesis_rl:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=denogenesis_api:10m rate=2r/s;

# ---------------------------------------------------------------------------
# HTTP :80 — serve the ACME challenge over plain HTTP (for issuance/renewal),
# redirect everything else straight to the canonical HTTPS apex.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name denogenesis.com www.denogenesis.com;
    include snippets/deny-probes.conf;

    server_tokens off;

    # Let's Encrypt HTTP-01 challenge. Must stay reachable over HTTP so that
    # `certbot --webroot -w /var/www/certbot` can renew without downtime.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://denogenesis.com$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS :443 www — canonicalize www.denogenesis.com to the bare apex.
# ---------------------------------------------------------------------------
server {
    # Bare, with no `ssl` or `http2`: those are properties of the socket, and
    # deploy/nginx/00-default-drop has already set them for :443.
    listen 443;
    listen [::]:443;
    server_name www.denogenesis.com;
    include snippets/deny-probes.conf;

    # --- TLS certificate (issued by certbot) ---
    ssl_certificate     /etc/letsencrypt/live/denogenesis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/denogenesis.com/privkey.pem;

    # Do not advertise the nginx version in responses or error pages.
    server_tokens off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://denogenesis.com$request_uri;
}

# ---------------------------------------------------------------------------
# HTTPS :443 apex — the real site.
# ---------------------------------------------------------------------------
server {
    # Bare, with no `ssl` or `http2`: those belong to the address:port and are
    # declared once in deploy/nginx/00-default-drop, which nginx parses first.
    # This vhost inherits TLS and HTTP/2 from there; repeating them here earns
    # a "protocol options redefined" warning and changes nothing.
    listen 443;
    listen [::]:443;
    server_name denogenesis.com;
    include snippets/deny-probes.conf;

    # Do not advertise the nginx version in responses or error pages.
    server_tokens off;

    # The site is read-only static content + one tiny JSON endpoint.
    client_max_body_size 16k;

    # --- TLS certificate (issued by certbot) ---
    ssl_certificate     /etc/letsencrypt/live/denogenesis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/denogenesis.com/privkey.pem;

    # --- TLS policy (Mozilla "intermediate": TLS 1.2 + 1.3 only) ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSLDG:10m;
    ssl_session_tickets off;

    # No OCSP stapling: Let's Encrypt certificates no longer carry an OCSP
    # responder URL (OCSP is being retired in favor of CRLs), so stapling would
    # only emit a "no OCSP responder URL" warning and do nothing.

    # Security headers (HSTS, CSP, X-Frame-Options: DENY, X-Content-Type-Options,
    # Referrer-Policy, Permissions-Policy, ...) are emitted by the app — HSTS
    # once it sees X-Forwarded-Proto: https (set below) — so they are
    # intentionally not duplicated with add_header here.

    # The app serves everything uncompressed; compress text assets at the edge.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    access_log /var/log/nginx/denogenesis.access.log;
    error_log /var/log/nginx/denogenesis.error.log warn;

    # Waitlist API: the only place POST is permitted, with a tight rate limit
    # and a small body cap (it only ever receives a short JSON payload).
    location /api/ {
        limit_except GET HEAD POST {
            deny all;
        }
        limit_req zone=denogenesis_api burst=5 nodelay;
        client_max_body_size 2k;

        proxy_pass http://denogenesis_deno;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";
        proxy_redirect off;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        # Only safe, read-only methods reach the app; reject everything else at
        # the edge (the app enforces the same set as defense in depth).
        limit_except GET HEAD {
            deny all;
        }

        # Allow short bursts, then throttle without dropping legitimate traffic.
        limit_req zone=denogenesis_rl burst=40 nodelay;

        proxy_pass http://denogenesis_deno;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";
        proxy_redirect off;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
