# Deploy to /etc/fail2ban/filter.d/nginx-probes.conf
#
# Matches nginx access-log lines requesting PHP/WordPress/dotfile paths —
# none of which exist on this all-Deno server, so any hit is a scanner.
# NOTE: if a PHP or WordPress site is ever hosted on this box, its
# legitimate admin traffic would match this filter; scope logpath in
# jail.local away from that site's log before enabling.
#
# Test against a real log:
#   sudo fail2ban-regex /var/log/nginx/access.log /etc/fail2ban/filter.d/nginx-probes.conf
[Definition]
failregex = ^<HOST> .* "(GET|POST|HEAD) [^"]*(\.php|\.env|\.git|/wp-admin|/wp-login|/phpmyadmin)[^"]*" \d+
ignoreregex =
